USE_WANDB: True                   # wandb logging (training only)
DTYPE:
  bfloat16
PRIMARY_METRIC: val/diverse_set_recall@5
TRAIN:
  ENABLE: True                    # True = train. For eval-only: set False and TEST.ENABLE True.
  USE_MIXUP: True
  NUM_WORKERS: 2
  EPOCHS: 50
  OPTIMIZER: adamw
  BATCH_SIZE: 128
  LR: 0.0005
  WEIGHT_DECAY: 0.
  GRADIENT_CLIPPING: 1.0
VAL:
  NUM_WORKERS: 2
  BATCH_SIZE: 128
TEST:                             # eval-only: load a trained checkpoint and run validation once
  ENABLE: False                   # set True (and TRAIN.ENABLE False) to evaluate a checkpoint
  CKPT_PATH:                      # run dir under checkpoints/, e.g. MAMBA-4-4-1024_..._20260607-21_35_06
DATA:
  DATA_ROOT_PATH: /home/s4076893/Desktop
  FEAT_DIR: epickitchens100/features/rgb_kinetics_bninception
  FUTURE_STEP_IN_SEC: 1.
  TAU_O: 32.
  LONG_MEMORY_LENGTH: 31.
CLUSTERING:
  ENABLE: True
MODEL:
  ENCODER_CLASS: MAMBA
  CRITERION_CLASS: Criterion_LSTR
  IGNORE_INDEX: 0
  ACTION_CLS: True
  VERB_CLS: True
  NOUN_CLS: True
  N_LAYER: 4
  N_DEC_LAYER: 4
  D_MODEL: 1024
  D_FFN: 4096
  SHARE_CLASSIFIER: True
  N_QUERIES: 1
  DROPOUT: 0.1
  DROP_CLS: 0.2
  PRENORM: False
  MAMBA_VERSION: 1
  D_STATE: 16
  CLS_WORK: False
  CLS_LAST: False
  CLS_ALL: True
  DIVERSE_SET:
    ENABLE: True                  # diverse-set metrics + losses (False = plain single-action baseline)
    MULTI_QUERY: True             # True = K decoder slots [B,K,A]; False = single head (+ inference rerank)
    SET_SIZE: 5                   # K = number of predictions in the set
    # --- Step 8: diversity regulariser (fixed-role coverage) ---
    DIVERSITY_WEIGHT: 1.0         # 0 = Step-7 WTA ablation; >0 = fixed-role coverage (8(5) used 1.0)
    DIVERSITY_TEMP: 1.0
    DIVERSITY_WARMUP_EPOCHS: 10
    COVERAGE_SOURCE: transition   # 'transition' = Step 9B; 'self' = Step 8(5) self-distillation ablation
    OBJECT_WEIGHT: 30.0           # object grounding: coverage targets must involve a noun observed in the
                                  # clip (fixes the popularity-marginal slot collapse: turn-on tap/open
                                  # drawer reused for ~2/3 of clips). >=30 = hard preference (exceeds the
                                  # prior's full log range); a few nats = soft preference; 0 = plain 9B
    HIT_WEIGHT: 1.
    HIT_EPSILON: 0.
    # --- Step 9A: inference-time transition fusion (eval-only; needs TEST.ENABLE True) ---
    TRANSITION_WEIGHT: 0.         # 0 = off; >0 fuses logP(next|prev) into eval logits (λ≈2 best)
    TRANSITION_FUSE_SOURCE: past_head   # 'past_head' (realistic) or 'gt_prev' (oracle upper bound)
    TRANSITION_ANNO: annotations/ek100_rulstm/
    TEMPORAL_WEIGHT: 0.           # reserved/unused
